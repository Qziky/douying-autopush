[project]
name = "douyin-auto-content"
version = "1.0.0"
description = "抖音自动化内容生产系统（个人版）：热点发现 -> 文案生成 -> 视频渲染 -> 自动发布"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "personal" }]
dependencies = [
    # 基础
    "requests>=2.31.0",          # 网络请求
    "beautifulsoup4>=4.12.0",    # DOM 解析（热点采集备用）
    "PyYAML>=6.0",               # 配置解析
    "APScheduler>=3.10,<4",      # 定时调度
    # 视频渲染
    "moviepy>=2.0.0",            # 视频合成（自动携带 imageio-ffmpeg）
    "edge-tts>=6.1.0",           # 微软免费语音合成
    "Pillow>=10.0.0",            # 图片处理 / 字幕渲染 / 占位图
    "numpy>=1.26.0",             # moviepy 依赖
    # 浏览器自动化（发布）
    "playwright>=1.40.0",
]

[tool.uv]
# 本项目为应用而非可发布包：只管理环境与依赖，不构建 wheel
package = false

# 国内镜像加速（如需官方源，删除本段即可）
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
